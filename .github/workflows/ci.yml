name: CareChain CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B clean verify

      - name: Validate Docker Compose config
        env:
          CARECHAIN_DB_URL: jdbc:mysql://mysql:3306/carechain?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC
          CARECHAIN_DB_USERNAME: carechain
          CARECHAIN_DB_PASSWORD: ci-db-password
          CARECHAIN_DB_ROOT_PASSWORD: ci-root-password
          CARECHAIN_JWT_SECRET: Y2FyZWNoYWluLWhvc3BpdGFsLXJlc291cmNlLW1hbmFnZW1lbnQtc3lzdGVtLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjQ=
          GRAFANA_ADMIN_USER: grafana-admin
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose config

      - name: Build Docker image
        run: docker build -t carechain:${{ github.sha }} .
