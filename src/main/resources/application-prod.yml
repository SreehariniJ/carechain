debug: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  datasource:
    url: ${CARECHAIN_DB_URL}
    username: ${CARECHAIN_DB_USERNAME}
    password: ${CARECHAIN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${CARECHAIN_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${CARECHAIN_DB_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    clean-disabled: true
    connect-retries: 10
  sql:
    init:
      mode: never
  thymeleaf:
    cache: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

jwt:
  secret: ${CARECHAIN_JWT_SECRET}
  expiration: ${CARECHAIN_JWT_EXPIRATION:86400000}

carechain:
  auth:
    cookie:
      name: jwt
      max-age-seconds: 86400
      secure: true
      same-site: Lax
      domain: ${CARECHAIN_COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CARECHAIN_ALLOWED_ORIGINS:}
  bootstrap:
    admin:
      email: ${CARECHAIN_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${CARECHAIN_BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${CARECHAIN_BOOTSTRAP_ADMIN_NAME:CareChain Admin}
  billing:
    currency-code: ${CARECHAIN_BILLING_CURRENCY:INR}
    consultation-fee: ${CARECHAIN_BILLING_CONSULTATION_FEE:650}
    discharge-processing-fee: ${CARECHAIN_BILLING_DISCHARGE_FEE:250}
    general-daily-rate: ${CARECHAIN_BILLING_GENERAL_DAILY_RATE:2200}
    icu-daily-rate: ${CARECHAIN_BILLING_ICU_DAILY_RATE:9500}
    emergency-daily-rate: ${CARECHAIN_BILLING_EMERGENCY_DAILY_RATE:4000}
    maternity-daily-rate: ${CARECHAIN_BILLING_MATERNITY_DAILY_RATE:3500}
  triage:
    model:
      version: ${CARECHAIN_TRIAGE_MODEL_VERSION:local-triage-v2}
      corpus-resource: ${CARECHAIN_TRIAGE_CORPUS_RESOURCE:triage/training-corpus.csv}
      neighbor-count: ${CARECHAIN_TRIAGE_NEIGHBOR_COUNT:6}
      minimum-similarity: ${CARECHAIN_TRIAGE_MINIMUM_SIMILARITY:0.01}
      weak-match-threshold: ${CARECHAIN_TRIAGE_WEAK_MATCH_THRESHOLD:0.14}
      emergency-similarity-threshold: ${CARECHAIN_TRIAGE_EMERGENCY_SIMILARITY_THRESHOLD:0.18}
      pediatric-age-cutoff: ${CARECHAIN_TRIAGE_PEDIATRIC_AGE_CUTOFF:14}
      pediatric-boost: ${CARECHAIN_TRIAGE_PEDIATRIC_BOOST:0.18}
      pediatric-context-boost: ${CARECHAIN_TRIAGE_PEDIATRIC_CONTEXT_BOOST:0.24}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
