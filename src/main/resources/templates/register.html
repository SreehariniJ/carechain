<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareChain - Register</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh;
            background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
            display:flex; align-items:center; justify-content:center; padding:20px;
        }
        .bg-orbs { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.35; animation:float 8s ease-in-out infinite; }
        .orb-1 { width:400px; height:400px; background:#667eea; top:-100px; right:-100px; }
        .orb-2 { width:300px; height:300px; background:#764ba2; bottom:-80px; left:-80px; animation-delay:-4s; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }
        .reg-card {
            position:relative; z-index:1;
            background:rgba(255,255,255,0.08); backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,0.15); border-radius:24px;
            padding:40px; width:100%; max-width:500px;
            box-shadow:0 32px 64px rgba(0,0,0,0.3);
        }
        .brand { text-align:center; margin-bottom:28px; }
        .brand-icon {
            width:56px; height:56px; border-radius:14px;
            background:linear-gradient(135deg,#667eea,#764ba2);
            display:inline-flex; align-items:center; justify-content:center;
            font-size:24px; color:#fff; margin-bottom:12px;
        }
        .brand h1 { color:#fff; font-size:1.5rem; font-weight:700; }
        .brand p { color:rgba(255,255,255,0.5); font-size:0.85rem; }
        .form-floating, .field-control { margin-bottom:16px; }
        .form-floating .form-control, .form-select {
            background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
            border-radius:12px; color:#fff; height:52px; transition:all 0.3s;
        }
        .form-floating .form-control:focus, .form-select:focus {
            background:rgba(255,255,255,0.1); border-color:#667eea;
            box-shadow:0 0 0 3px rgba(102,126,234,0.25); color:#fff;
        }
        .form-floating label { color:rgba(255,255,255,0.5); }
        .form-select {
            --bs-form-select-bg-img:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='rgba(255,255,255,0.72)' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
        }
        .form-select.placeholder-active { color:rgba(255,255,255,0.5); }
        .form-select option { background:#302b63; color:#fff; }
        .btn-register {
            width:100%; padding:14px; border:none; border-radius:12px;
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:#fff; font-weight:600; font-size:1rem; cursor:pointer; transition:all 0.3s;
        }
        .btn-register:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(102,126,234,0.4); }
        .btn-register:disabled { opacity:0.6; transform:none; }
        .alert-error {
            background:rgba(220,53,69,0.15); border:1px solid rgba(220,53,69,0.3);
            color:#ff6b7a; border-radius:12px; padding:12px 16px; font-size:0.875rem;
            margin-bottom:16px; display:none;
        }
        .alert-success {
            background:rgba(25,135,84,0.15); border:1px solid rgba(25,135,84,0.3);
            color:#75e6a0; border-radius:12px; padding:12px 16px; font-size:0.875rem;
            margin-bottom:16px; display:none;
        }
        .login-link { text-align:center; margin-top:20px; color:rgba(255,255,255,0.5); font-size:0.9rem; }
        .login-link a { color:#667eea; text-decoration:none; font-weight:500; }
        .row-g { display:flex; gap:12px; }
        .row-g > div { flex:1; }
    </style>
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

    <div class="reg-card">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-heart-pulse"></i></div>
            <h1>Create Account</h1>
            <p>Register as a patient to get started</p>
        </div>

        <div id="errorAlert" class="alert-error"><i class="bi bi-exclamation-triangle me-2"></i><span id="errorMsg"></span></div>
        <div id="successAlert" class="alert-success"><i class="bi bi-check-circle me-2"></i><span id="successMsg"></span></div>

        <form id="registerForm" onsubmit="return handleRegister(event)">
            <div class="form-floating">
                <input type="text" class="form-control" id="name" placeholder="Full Name" required>
                <label for="name">Full Name</label>
            </div>
            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
                <label for="email">Email address</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password" required minlength="8" maxlength="72">
                <label for="password">Password</label>
            </div>
            <div class="row-g">
                <div class="form-floating">
                    <input type="number" class="form-control" id="age" placeholder="Age" min="1" max="150">
                    <label for="age">Age</label>
                </div>
                <div class="field-control">
                    <select class="form-select" id="bloodGroup" aria-label="Blood Group">
                        <option value="" selected>Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>
            <div class="form-floating">
                <input type="tel" class="form-control" id="phone" placeholder="Phone" maxlength="15">
                <label for="phone">Phone Number</label>
            </div>
            <button type="submit" class="btn-register" id="regBtn">
                <span id="btnText">Create Account</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" style="display:none"></span>
            </button>
        </form>
        <div class="login-link">Already have an account? <a href="/login">Sign in</a></div>
    </div>

    <script src="/js/app-auth.js"></script>
    <script>
        const bloodGroupSelect = document.getElementById('bloodGroup');

        function syncBloodGroupPlaceholder() {
            bloodGroupSelect.classList.toggle('placeholder-active', !bloodGroupSelect.value);
        }

        bloodGroupSelect.addEventListener('change', syncBloodGroupPlaceholder);
        syncBloodGroupPlaceholder();

        function getErrorMessage(data, fallback) {
            if (data.fieldErrors) {
                const firstField = Object.keys(data.fieldErrors)[0];
                if (firstField) {
                    return data.fieldErrors[firstField];
                }
            }
            return data.error || fallback;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');

            btn.disabled = true; btnText.textContent = 'Creating...'; spinner.style.display = 'inline-block';
            errorAlert.style.display = 'none'; successAlert.style.display = 'none';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        name: document.getElementById('name').value,
                        age: parseInt(document.getElementById('age').value) || null,
                        bloodGroup: document.getElementById('bloodGroup').value,
                        phone: document.getElementById('phone').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(getErrorMessage(data, 'Registration failed'));

                successAlert.style.display = 'block';
                document.getElementById('successMsg').textContent = 'Account created! Redirecting...';
                storeUser({ email: data.email, role: data.role });
                setTimeout(() => window.location.href = '/dashboard/patient', 1500);
            } catch (err) {
                errorAlert.style.display = 'block';
                document.getElementById('errorMsg').textContent = err.message;
                btn.disabled = false; btnText.textContent = 'Create Account'; spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
