<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareChain - Login</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0a58ca;
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --glass-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
        }
        .bg-orbs {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: #667eea; top: -100px; left: -100px; }
        .orb-2 { width: 350px; height: 350px; background: #764ba2; bottom: -80px; right: -80px; animation-delay: -4s; }
        .orb-3 { width: 250px; height: 250px; background: #f093fb; top: 50%; left: 60%; animation-delay: -2s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
        .login-card {
            position: relative; z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%; max-width: 440px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.3);
        }
        .brand { text-align: center; margin-bottom: 36px; }
        .brand-icon {
            width: 64px; height: 64px; border-radius: 16px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 28px; color: #fff; margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(102,126,234,0.4);
        }
        .brand h1 { color: #fff; font-size: 1.75rem; font-weight: 700; }
        .brand p { color: rgba(255,255,255,0.55); font-size: 0.9rem; margin-top: 4px; }
        .form-floating { margin-bottom: 20px; }
        .form-floating .form-control {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; color: #fff; height: 56px;
            transition: all 0.3s;
        }
        .form-floating .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--gradient-start);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
            color: #fff;
        }
        .form-floating label { color: rgba(255,255,255,0.5); }
        .btn-login {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: #fff; font-weight: 600; font-size: 1rem;
            transition: all 0.3s; cursor: pointer;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(102,126,234,0.4); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; transform: none; }
        .alert-error {
            background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3);
            color: #ff6b7a; border-radius: 12px; padding: 12px 16px; font-size: 0.875rem;
            margin-bottom: 20px; display: none;
        }
        .register-link {
            text-align: center; margin-top: 24px; color: rgba(255,255,255,0.5); font-size: 0.9rem;
        }
        .register-link a { color: var(--gradient-start); text-decoration: none; font-weight: 500; }
        .register-link a:hover { text-decoration: underline; }
        .spinner-border { width: 1.2rem; height: 1.2rem; }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-heart-pulse"></i></div>
            <h1>CareChain</h1>
            <p>Hospital Resource Management</p>
        </div>

        <div id="errorAlert" class="alert-error">
            <i class="bi bi-exclamation-triangle me-2"></i><span id="errorMsg"></span>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
                <label for="email"><i class="bi bi-envelope me-2"></i>Email address</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Sign In</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" style="display:none"></span>
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="/register">Create one</a>
        </div>
        <div class="register-link" style="margin-top:8px">
            <a href="/beds/availability">View Bed Availability</a>
        </div>
    </div>

    <script src="/js/app-auth.js"></script>
    <script>
        function getErrorMessage(data, fallback) {
            if (data.fieldErrors) {
                const firstField = Object.keys(data.fieldErrors)[0];
                if (firstField) {
                    return data.fieldErrors[firstField];
                }
            }
            return data.error || fallback;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            spinner.style.display = 'inline-block';
            errorAlert.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(getErrorMessage(data, 'Login failed'));
                }

                storeUser({ email: data.email, role: data.role });

                switch (data.role) {
                    case 'ADMIN': window.location.href = '/dashboard/admin'; break;
                    case 'DOCTOR': window.location.href = '/dashboard/doctor'; break;
                    default: window.location.href = '/dashboard/patient'; break;
                }
            } catch (err) {
                errorAlert.style.display = 'block';
                errorMsg.textContent = err.message;
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
